<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silence Room setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="Today.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">Silence Room</h1>
<span style="width: 44px; flex-shrink: 0"></span>
</header>
<main style="display: flex; flex-direction: column; gap: 18px; padding: 4px 20px 24px 20px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<svg width="220" height="220" viewBox="0 0 240 240" aria-hidden="true">
<circle cx="120" cy="120" r="108" fill="none" stroke="#2A2D30" stroke-width="1" stroke-dasharray="3 6"></circle>
<circle cx="120" cy="120" r="88" fill="none" stroke="#FF7A45" stroke-width="4" stroke-dasharray="420 133" stroke-linecap="round" transform="rotate(-90 120 120)"></circle>
<circle cx="120" cy="32" r="5" fill="#4ADE80"></circle><circle cx="38" cy="150" r="4" fill="#FFB99A"></circle><circle cx="196" cy="176" r="4" fill="#4ADE80"></circle><circle cx="206" cy="82" r="3" fill="#9FE3D6"></circle>
<text x="120" y="126" text-anchor="middle" font-size="52" font-weight="700" fill="#F2F2F2" font-family="Inter, sans-serif">{{ bigNum }}</text>
<text x="120" y="154" text-anchor="middle" font-size="13" fill="#A0A4A8" font-family="Inter, sans-serif">{{ bigLabel }}</text>
</svg>
<span style="font-size: 13px; color: #A0A4A8; text-align: center">{{ placesLine }}</span>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; line-height: 1.5; color: #9FE3D6; text-align: center; padding: 0 12px">Quiet right now. We never add fake numbers, so this is the honest count of everyone who meditated here today.</span>
</sc-if>
</div>

<section style="background: #17191B; border: 1px solid #23262A; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 16px; font-weight: 600">Timer</span><span style="font-size: 13px; color: #A0A4A8">{{ timerNote }}</span></span>
<button type="button" role="switch" aria-label="Timer" aria-checked="{{ timer }}" onClick="{{ flipTimer }}" style="{{ timerTrack }}"><span style="{{ timerKnob }}"></span></button>
</div>
<sc-if value="{{ timer }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{ lens }}" as="o" hint-placeholder-count="6"><button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div>
</sc-if>
</section>

<section style="background: #17191B; border: 1px solid #23262A; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 16px; font-weight: 600">Chime</span><span style="font-size: 13px; color: #A0A4A8">At the start and the end</span></span>
<button type="button" role="switch" aria-label="Chime" aria-checked="{{ chime }}" onClick="{{ flipChime }}" style="{{ chimeTrack }}"><span style="{{ chimeKnob }}"></span></button>
</div>
<sc-if value="{{ chime }}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><sc-for list="{{ bells }}" as="o" hint-placeholder-count="2"><button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div>
</sc-if>
</section>

<a href="SilenceSession.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; background: #FF7A45; color: #2A0E02; font-size: 16px; font-weight: 700; text-decoration: none">Enter the Silence Room</a>
<span style="font-size: 12px; color: #A0A4A8; text-align: center">Part of membership. Others see only your country, never your name.</span>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"room":{"editor":"enum","options":["people sitting","empty"],"default":"people sitting"},"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { timer: true, len: 2, chime: true, bell: 0 }; }
  renderVals() {
    var self = this, s = this.state;
    var sw = function (on) { return { track: 'width:52px;height:32px;border-radius:999px;border:none;padding:3px;display:flex;align-items:center;cursor:pointer;flex-shrink:0;box-sizing:border-box;' + (on ? 'background:#FF7A45;justify-content:flex-end;' : 'background:#2A2D30;justify-content:flex-start;'), knob: 'width:26px;height:26px;border-radius:999px;display:block;' + (on ? 'background:#2A0E02;' : 'background:#A0A4A8;') }; };
    var pill = function (on) { return 'min-height:44px;padding:0 16px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;' + (on ? 'background:#FF7A45;color:#2A0E02;border:1px solid #FF7A45;' : 'background:#0F1112;color:#F2F2F2;border:1px solid #2A2D30;'); };
    var L = ['5 min', '10 min', '15 min', '20 min', '30 min', '60 min'];
    var lens = L.map(function (t, i) { return { label: t, style: pill(s.len === i), pick: function () { self.setState({ len: i }); } }; });
    var bells = ['Tibetan bowl', 'Temple bell'].map(function (t, i) { return { label: t, style: pill(s.bell === i), pick: function () { self.setState({ bell: i }); } }; });
    var t = sw(s.timer), c = sw(s.chime);
    var empty = (this.props.room ?? 'people sitting') === 'empty';
    return {
      empty: empty,
      bigNum: empty ? '842' : '9',
      bigLabel: empty ? 'meditated here today' : 'meditating in silence now',
      placesLine: empty ? '0 meditating right now' : 'London · Berlin · Toronto · Sydney · Lahore',
      timer: s.timer, chime: s.chime, lens: lens, bells: bells,
      timerNote: s.timer ? L[s.len] : 'Open-ended, end when you like',
      timerTrack: t.track, timerKnob: t.knob, chimeTrack: c.track, chimeKnob: c.knob,
      flipTimer: function () { self.setState({ timer: !s.timer }); },
      flipChime: function () { self.setState({ chime: !s.chime }); }
    };
  }
}
</script>
</body>
</html>
