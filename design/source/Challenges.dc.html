<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Challenges</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="You.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">Challenges</h1>
<span style="width: 44px; flex-shrink: 0"></span>
</header>

<main style="display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 28px 20px">
<span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 1px; border-radius: 999px; padding: 4px 10px; background: #23262A; color: #C9CCCF">COMING SOON</span>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #A0A4A8">Meditate any length, once a day. Every meditation counts.</p>

<section style="background: linear-gradient(160deg, #2A1810 0%, #17191B 75%); border: 1.5px solid #FF7A45; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #FF9B70; flex-grow: 1">IN PROGRESS</span><span style="font-size: 12px; color: #A0A4A8">1,904 people in it</span></div>
<h2 style="margin: 0; font-size: 24px; font-weight: 700">7 days of calm</h2>
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 40px; font-weight: 700; color: #FF9B70">{{ done }}</span><span style="font-size: 16px; color: #A0A4A8">of 7 days</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7"><span style="{{ d }}"></span></sc-for>
</div>
<span style="font-size: 13px; line-height: 1.5; color: #C9CCCF">{{ note }}</span>
<a href="Today.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 999px; background: #FF7A45; color: #2A0E02; font-size: 15px; font-weight: 700; text-decoration: none">Meditate today</a>
</section>

<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8; padding-top: 4px">START ANOTHER</span>
<sc-for list="{{ more }}" as="c" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #17191B; border: 1px solid #23262A">
<span style="{{ c.art }}"></span>
<span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1"><span style="font-size: 16px; font-weight: 700">{{ c.name }}</span><span style="font-size: 13px; color: #A0A4A8">{{ c.meta }}</span></span>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3E42; background: transparent; color: #F2F2F2; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{ c.cta }}</button>
</div>
</sc-for>

<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8; padding-top: 4px">FINISHED</span>
<div style="display: flex; gap: 10px">
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 88px; padding: 12px 0; border-radius: 16px; background: #17191B; border: 1px solid #23262A; font-size: 12px; color: #C9CCCF"><span style="width: 44px; height: 44px; border-radius: 999px; background: #123C3A; color: #4ADE80; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">7</span>September</span>
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 88px; padding: 12px 0; border-radius: 16px; background: transparent; border: 1px dashed #3A3E42; font-size: 12px; color: #6E7378"><span style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">21</span>Not yet</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var cell = 'height:34px;border-radius:10px;box-sizing:border-box;';
    var st = ['sat', 'sat', 'sat', 'sat', 'sat', 'next', 'next'];
    var days = st.map(function (k) {
      return cell + (k === 'sat' ? 'background:#FF7A45;' : (k === 'grace' ? 'border:2px dashed #9FE3D6;' : 'background:#23262A;'));
    });
    var art = function (img) { return 'width:64px;height:64px;border-radius:16px;flex-shrink:0;background:#17191B url(img/' + img + '.jpg) center/cover;'; };
    var more = [
      { name: '21 days to a habit', meta: '21 days · any meditation', cta: 'Start', art: art('dawn') },
      { name: 'Sleep week', meta: '7 nights · sleep meditations only', cta: 'Start', art: art('night') }
    ];
    return { days: days, done: '5', more: more, note: '2 days to go.' };
  }
}
</script>
</body>
</html>
