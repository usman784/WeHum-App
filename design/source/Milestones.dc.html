<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Milestones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="You.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">Milestones</h1>
<span style="width: 44px; flex-shrink: 0"></span>
</header>
<main style="display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 28px 20px">
<span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 1px; border-radius: 999px; padding: 4px 10px; background: #23262A; color: #C9CCCF">COMING SOON</span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8">YOUR AWARDS · 4 OF 12</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ awards }}" as="a" hint-placeholder-count="9">
<div style="{{ a.card }}"><span style="{{ a.badge }}">{{ a.num }}</span><span style="font-size: 12px; font-weight: 600; text-align: center">{{ a.name }}</span></div>
</sc-for>
</div>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8; padding-top: 6px">THE WORLD SO FAR</span>
<section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="background: #17191B; border: 1px solid #23262A; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 26px; font-weight: 700">2.4M</span><span style="font-size: 12px; color: #A0A4A8">minutes meditated on WeHum</span></div>
<div style="background: #17191B; border: 1px solid #23262A; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 26px; font-weight: 700">186k</span><span style="font-size: 12px; color: #A0A4A8">meditations</span></div>
<div style="background: #17191B; border: 1px solid #23262A; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 26px; font-weight: 700">94</span><span style="font-size: 12px; color: #A0A4A8">countries</span></div>
<div style="background: #17191B; border: 1px solid #23262A; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 26px; font-weight: 700">41k</span><span style="font-size: 12px; color: #A0A4A8">dedications</span></div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [['1', 'First meditation', 1], ['7', '7 days meditated', 1], ['100', '100 minutes', 1], ['10', '10 group meditations', 1], ['21', '21 days meditated', 0], ['500', '500 minutes', 0], ['30', '30 countries meditated with', 0], ['50', '50 meditations', 0], ['1k', '1,000 minutes', 0]];
    var awards = list.map(function (a) {
      var won = a[2] === 1;
      return {
        num: a[0], name: a[1],
        card: 'display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;' + (won ? 'background:#17191B;border:1px solid #23262A;color:#F2F2F2;' : 'background:transparent;border:1px dashed #3A3E42;color:#6E7378;'),
        badge: 'width:52px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;' + (won ? 'background:radial-gradient(circle, #FFB99A, #FF7A45);color:#2A0E02;' : 'background:#17191B;color:#6E7378;')
      };
    });
    return { awards: awards };
  }
}
</script>
</body>
</html>
