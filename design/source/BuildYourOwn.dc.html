<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build your own</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
input[type=range]{accent-color:#FF7A45}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="Library.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">Build your own</h1>
<a href="MySits.dc.html" aria-label="My Meditations" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg></a>
</header>

<main style="display: flex; flex-direction: column; gap: 22px; padding: 4px 20px 200px 20px">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8">1 · LENGTH</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ len }}" as="o" hint-placeholder-count="7"><button type="button" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8">2 · OPENING</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><sc-for list="{{ open }}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}" style="{{ o.style }}"><span style="font-size: 15px; font-weight: 600">{{ o.label }}</span><span style="font-size: 12px; color: #A0A4A8">{{ o.sub }}</span></button></sc-for></div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8">3 · SOUND</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><sc-for list="{{ sound }}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}" style="{{ o.style }}"><span style="font-size: 15px; font-weight: 600">{{ o.label }}</span><span style="font-size: 12px; color: #A0A4A8">{{ o.sub }}</span></button></sc-for></div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 16px; background: #17191B; border: 1px solid #23262A">
<label style="display: flex; align-items: center; gap: 12px; font-size: 14px"><span style="width: 52px">Level</span><input type="range" min="0" max="100" value="60" aria-label="Sound level" style="flex-grow: 1"></label>
<div role="radiogroup" aria-label="Sound texture" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #0F1112">
<sc-for list="{{ tex }}" as="t" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{ t.on }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8">4 · BELLS</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ bells }}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div>
</section>

<a href="BuildAdvanced.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: transparent; border: 1px dashed #3A3E42; text-decoration: none; color: #F2F2F2">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 14px; font-weight: 600">Advanced builder</span><span style="font-size: 12px; color: #A0A4A8">Several blocks, OM and mantra loops, share by link</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0A4A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px 20px; background: #0F1112; border-top: 1px solid #23262A; display: flex; flex-direction: column; gap: 10px">
<div aria-hidden="true" style="display: flex; gap: 3px; height: 8px; border-radius: 999px; overflow: hidden">
<span style="{{ bar.open }}"></span><span style="flex: 10; background: #123C3A"></span><span style="flex: 1; background: #2A2D30"></span><span style="flex: 1.5; background: #2A1F33"></span>
</div>
<span style="font-size: 14px; font-weight: 600">{{ summary }}</span>
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
<a href="MySits.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #1E2124; border: 1px solid #2A2D30; color: #F2F2F2; font-size: 14px; font-weight: 600; text-decoration: none">Save</a>
<a href="Player.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; background: #FF7A45; color: #2A0E02; font-size: 16px; font-weight: 700; text-decoration: none">Build it</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { len: 2, open: 1, sound: 1, tex: 1, bells: 1 }; }
  renderVals() {
    var self = this, s = this.state;
    var pill = function (on) { return 'min-height:44px;padding:0 16px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;' + (on ? 'background:#FF7A45;color:#2A0E02;border:1px solid #FF7A45;' : 'background:#17191B;color:#F2F2F2;border:1px solid #2A2D30;'); };
    var tile = function (on) { return 'display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;min-height:68px;border-radius:16px;font-family:inherit;text-align:left;cursor:pointer;color:#F2F2F2;' + (on ? 'background:rgba(255,122,69,0.12);border:1.5px solid #FF7A45;' : 'background:#17191B;border:1px solid #23262A;'); };
    var mk = function (key, list, kind) {
      return list.map(function (o, i) {
        var st = {}; st[key] = i;
        return { label: o[0], sub: o[1] || '', on: s[key] === i, style: kind === 'pill' ? pill(s[key] === i) : tile(s[key] === i), pick: function () { self.setState(st); } };
      });
    };
    var L = [['5 min'], ['10 min'], ['15 min'], ['20 min'], ['30 min'], ['45 min'], ['60 min']];
    var O = [['Silence', 'Start right away'], ['Arrival', 'Raphael · 2 min'], ['Body settle', 'Raphael · 3 min'], ['Three breaths', 'Raphael · 1 min']];
    var S = [['Silence', 'No sound'], ['Rain on cedar', 'Nature'], ['Distant stream', 'Nature'], ['Deep tone', 'Headphones']];
    var B = [['Start and end'], ['Every 5 min'], ['Every 10 min'], ['No bells']];
    var tex = [['Simple', 0], ['Rich', 1]].map(function (t) { var on = s.tex === t[1]; return { label: t[0], on: on, pick: function () { self.setState({ tex: t[1] }); }, style: 'min-height:38px;border-radius:9px;border:none;font-family:inherit;font-size:13px;cursor:pointer;' + (on ? 'background:#FF7A45;color:#2A0E02;font-weight:700;' : 'background:transparent;color:#A0A4A8;font-weight:600;') }; });
    var summary = L[s.len][0] + ' · ' + O[s.open][0] + ' · ' + S[s.sound][0] + (s.sound ? ' (' + (s.tex ? 'rich' : 'simple') + ')' : '') + ' · ' + B[s.bells][0].toLowerCase();
    return {
      len: mk('len', L, 'pill'), open: mk('open', O, 'tile'), sound: mk('sound', S, 'tile'), bells: mk('bells', B, 'pill'), tex: tex,
      summary: summary,
      bar: { open: 'flex:' + (s.open ? 2 : 0.3) + ';background:#3A1D12;' }
    };
  }
}
</script>
</body>
</html>
