<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SoS sessions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 1260px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="Today.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">SoS</h1>
<span style="width: 44px; flex-shrink: 0"></span>
</header>
<main style="display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 24px 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.4px">How can I help?</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #A0A4A8">Short sessions for hard moments. Pick one and Raphael’s voice starts right away.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ items }}" as="i" hint-placeholder-count="8">
<a href="Player.dc.html" style="min-height: 150px; box-sizing: border-box; background: #17191B; border: 1px solid #23262A; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #F2F2F2">
<div style="display: flex; align-items: center; margin-bottom: auto"><span style="font-size: 12px; font-weight: 600; background: #23262A; border-radius: 8px; padding: 4px 8px">{{ i.len }}</span><span style="flex-grow: 1"></span><span style="width: 34px; height: 34px; border-radius: 999px; background: #2A1C15; color: #FF9B70; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg></span></div>
<span style="font-size: 16px; font-weight: 600; padding-top: 12px">{{ i.name }}</span>
<span style="font-size: 12px; line-height: 1.4; color: #A0A4A8">{{ i.sub }}</span>
</a>
</sc-for>
</div>
<section aria-label="More help" style="background: #17191B; border: 1px solid #23262A; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 999px; flex-shrink: 0; background: #24272A url('img/seated.jpg') center/cover"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Need more help?</span><span style="font-size: 13px; color: #A0A4A8">With Raphael, one to one</span></span>
</div>
<span style="font-size: 14px; line-height: 1.5; color: #D9DBDD">You can contact us and book a personal session with Raphael.</span>
<a href="Help.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #FF7A45; color: #2A0E02; font-size: 15px; font-weight: 700; text-decoration: none">Book a personal session</a>
<a href="Help.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; font-weight: 600; text-decoration: none">Contact us</a>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1260}}'>
class Component extends DCLogic {
  renderVals() {
    var items = [
      ['Panic', 'Grounding with the senses', '4 min'],
      ['Anxiety', 'A long, slow exhale', '6 min'],
      ['Can’t stop thinking', 'Step back from the loop', '5 min'],
      ['Low mood', 'Gentle, spacious awareness', '8 min'],
      ['Anger', 'Release and soften', '5 min'],
      ['Can’t sleep', 'Heavy body, slow descent', '8 min'],
      ['Overwhelm', 'One thing at a time', '4 min'],
      ['Grief', 'Steady holding', '7 min']
    ].map(function (x) { return { name: x[0], sub: x[1], len: x[2] }; });

    return { items: items };
  }
}
</script>
</body>
</html>
