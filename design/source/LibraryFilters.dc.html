<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #050607; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<section aria-label="Filters" style="margin-top: auto; background: #17191B; border-top: 1px solid #2A2D30; border-radius: 28px 28px 0 0; padding: 12px 20px 32px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #3A3E42"></div>
<div style="display: flex; align-items: center"><h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1">Filters</h1><button type="button" onClick="{{ reset }}" style="min-height: 44px; padding: 0 8px; border: none; background: transparent; color: #FF9B70; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Reset</button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #A0A4A8">LENGTH</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{ len }}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #A0A4A8">TEACHERS</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{ voice }}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #A0A4A8">TYPE</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{ type }}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 0">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 600">Downloaded only</span><span style="font-size: 13px; color: #A0A4A8">Meditations that play without internet</span></span>
<button type="button" role="switch" aria-label="Downloaded only" aria-checked="{{ dl }}" onClick="{{ flipDl }}" style="{{ dlTrack }}"><span style="{{ dlKnob }}"></span></button>
</div>
<a href="Discipline.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; background: #FF7A45; color: #2A0E02; font-size: 16px; font-weight: 700; text-decoration: none">Show 14 meditations</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { len: 0, voice: 0, sound: 0, type: 0, dl: false }; }
  renderVals() {
    var self = this, s = this.state;
    var pill = function (on) { return 'min-height:40px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;' + (on ? 'background:#FF7A45;color:#2A0E02;border:1px solid #FF7A45;' : 'background:#0F1112;color:#F2F2F2;border:1px solid #2A2D30;'); };
    var make = function (key, list) { return list.map(function (t, i) { var o = {}; o[key] = i; return { label: t, style: pill(s[key] === i), pick: function () { self.setState(o); } }; }); };
    var d = s.dl;
    return {
      len: make('len', ['Any', 'Under 10 min', '10–20 min', '20+ min']),
      voice: make('voice', ['All', 'Raphael Reiter']),
      sound: make('sound', ['Any', 'Silence', 'Nature', 'Deep tone']),
      type: make('type', ['All', 'Audio', 'Video', 'Free']),
      dl: d, flipDl: function () { self.setState({ dl: !d }); },
      dlTrack: 'width:52px;height:32px;border-radius:999px;border:none;padding:3px;display:flex;align-items:center;cursor:pointer;flex-shrink:0;box-sizing:border-box;' + (d ? 'background:#FF7A45;justify-content:flex-end;' : 'background:#2A2D30;justify-content:flex-start;'),
      dlKnob: 'width:26px;height:26px;border-radius:999px;display:block;' + (d ? 'background:#2A0E02;' : 'background:#A0A4A8;'),
      reset: function () { self.setState({ len: 0, voice: 0, sound: 0, type: 0, dl: false }); }
    };
  }
}
</script>
</body>
</html>
