<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminders and sounds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="You.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">Reminders &amp; sounds</h1>
<span style="width: 44px; flex-shrink: 0"></span>
</header>
<main style="display: flex; flex-direction: column; gap: 18px; padding: 4px 20px 24px 20px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8">REMINDERS</span>
<section style="background: #17191B; border: 1px solid #23262A; border-radius: 20px; overflow: hidden">
<sc-for list="{{ toggles }}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px; border-bottom: 1px solid #23262A">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px; font-weight: 600">{{ t.label }}</span><span style="font-size: 12px; color: #A0A4A8">{{ t.sub }}</span></span>
<button type="button" role="switch" aria-label="{{ t.label }}" aria-checked="{{ t.on }}" onClick="{{ t.flip }}" style="{{ t.track }}"><span style="{{ t.knob }}"></span></button>
</div>
</sc-for>
<a href="SitTime.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; text-decoration: none; color: #F2F2F2"><span style="font-size: 15px; flex-grow: 1">Daily meditation time</span><span style="font-size: 15px; font-weight: 600; color: #FF9B70">07:00</span></a>
<a href="PushPreview.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; border-top: 1px solid #23262A; text-decoration: none; color: #F2F2F2"><span style="font-size: 14px; flex-grow: 1">See what the notifications look like</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0A4A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<span style="padding: 4px 16px 14px 16px; font-size: 12px; line-height: 1.5; color: #6E7378">Times follow your phone’s time zone, so travelling doesn’t break them. We never send offers or marketing here.</span>
</section>


</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { daily: true, group: true, msg: true, wifi: true, chime: 0, bed: 1 }; }
  renderVals() {
    var self = this, s = this.state;
    var make = function (key, label, sub) {
      var on = s[key], o = {}; o[key] = !on;
      return {
        label: label, sub: sub, on: on, flip: function () { self.setState(o); },
        track: 'width:52px;height:32px;border-radius:999px;border:none;padding:3px;display:flex;align-items:center;cursor:pointer;flex-shrink:0;box-sizing:border-box;' + (on ? 'background:#FF7A45;justify-content:flex-end;' : 'background:#2A2D30;justify-content:flex-start;'),
        knob: 'width:26px;height:26px;border-radius:999px;display:block;' + (on ? 'background:#2A0E02;' : 'background:#A0A4A8;')
      };
    };
    var pill = function (on) { return 'min-height:44px;padding:0 16px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;' + (on ? 'background:#FF7A45;color:#2A0E02;border:1px solid #FF7A45;' : 'background:#0F1112;color:#F2F2F2;border:1px solid #2A2D30;'); };
    var chimes = ['Tibetan bowl', 'Temple bell'].map(function (t, i) { return { label: t, style: pill(s.chime === i), pick: function () { self.setState({ chime: i }); } }; });
    var beds = ['Silence', 'Rain on Cedar', 'Distant Stream'].map(function (t, i) { return { label: t, style: pill(s.bed === i), pick: function () { self.setState({ bed: i }); } }; });
    return {
      toggles: [
        make('daily', 'Daily meditation reminder', 'One nudge at your chosen time, in your time zone'),
        make('group', 'Group meditation warning', '10 minutes before a group meditation you tapped “Remind me” on'),
        make('msg', 'Daily message', 'When Raphael’s message is ready'),
        make('wifi', 'Download on Wi-Fi only', 'Saves mobile data')
      ],
      chimes: chimes, beds: beds
    };
  }
}
</script>
</body>
</html>
