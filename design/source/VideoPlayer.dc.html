<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="Discipline.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="flex-grow: 1"></span>
</header>
<div style="height: 220px; background: #24272A url('img/forest.jpg') center/cover; position: relative; display: flex; align-items: center; justify-content: center">
<button type="button" aria-label="{{ playLabel }}" onClick="{{ toggle }}" style="width: 72px; height: 72px; border-radius: 999px; border: none; background: #FF7A45; color: #2A0E02; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
<sc-if value="{{ paused }}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg></sc-if>
</button>
<div style="position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #D9DBDD"><span>12:04</span><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #3A3E42"><div style="width: 30%; height: 4px; border-radius: 999px; background: #FF7A45"></div></div><span>40:00</span></div>
</div>
<main style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 24px 20px">
<div style="display: flex; gap: 8px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; border-radius: 999px; padding: 4px 10px; background: rgba(255,122,69,0.14); color: #FF9B70">PREMIUM</span><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; border-radius: 999px; padding: 4px 10px; background: #1E2A3A; color: #A9C4E8">VIDEO</span></div>
<h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.3px">Love Without Fear</h1>
<span style="font-size: 14px; color: #A0A4A8">Raphael · Transcendent · 40 min</span>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #D9DBDD">A guided transcendence meditation on meeting others without fear. Find a quiet place where you can watch and listen.</p>
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 999px; background: #4ADE80"></span>3 people in this session now</span>
<a href="DedicationSheet.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; background: #1E2124; border: 1px solid #2A2D30; color: #F2F2F2; font-size: 15px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>Write your dedication</a>
<div style="display: flex; justify-content: space-between">
<a href="Dedications.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Read dedications (54)</a>
<a href="SessionComplete.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #A0A4A8; text-decoration: none">End meditation</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { playing: false }; }
  renderVals() {
    var self = this, p = this.state.playing;
    return { playing: p, paused: !p, playLabel: p ? 'Pause' : 'Play', toggle: function () { self.setState({ playing: !p }); } };
  }
}
</script>
</body>
</html>
