<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share your meditation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="SessionComplete.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">Share your meditation</h1>
<span style="width: 44px; flex-shrink: 0"></span>
</header>
<main style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 4px 20px 24px 20px">
<div role="radiogroup" aria-label="Format" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; width: 240px; border-radius: 12px; background: #17191B; border: 1px solid #23262A">
<sc-for list="{{ formats }}" as="f" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{ f.on }}" onClick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button></sc-for>
</div>
<section aria-label="Share card preview" style="{{ card }}">
<div style="display: flex; align-items: center; gap: 8px"><svg width="22" height="22" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="11" fill="none" stroke="#FF7A45" stroke-width="3.5" stroke-dasharray="52 18" stroke-linecap="round"></circle><circle cx="15" cy="15" r="6" fill="#4ADE80"></circle><circle cx="15" cy="15" r="2.4" fill="#0B0D0E"></circle></svg><span style="font-size: 13px; font-weight: 700; letter-spacing: 1px">WEHUM</span></div>
<span style="font-size: 26px; font-weight: 700; line-height: 1.2; margin-top: auto">I meditated 14 minutes today.</span>
<span style="font-size: 15px; line-height: 1.4; color: #CFEDE6">I meditated with 412 people in 37 countries.</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="background: rgba(11,13,14,0.35); border-radius: 12px; padding: 10px"><span style="display: block; font-size: 18px; font-weight: 700; color: #FFB99A">5 days</span><span style="font-size: 11px; color: #CFEDE6">this week</span></div>
<div style="background: rgba(11,13,14,0.35); border-radius: 12px; padding: 10px"><span style="display: block; font-size: 18px; font-weight: 700">Steady</span><span style="font-size: 11px; color: #CFEDE6">Under Pressure</span></div>
</div>
<sc-if value="{{ showDedication }}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; line-height: 1.45; font-style: italic; color: #E6F5F1">“For my team before a hard week.”</span></sc-if>
<span style="font-size: 11px; color: #E6F5F1">wehum.app</span>
</section>
<div style="align-self: stretch; display: flex; align-items: center; gap: 12px; padding: 12px 4px">
<span style="flex-grow: 1; font-size: 15px">Show my dedication</span>
<button type="button" role="switch" aria-label="Show my dedication" aria-checked="{{ showDedication }}" onClick="{{ flip }}" style="{{ track }}"><span style="{{ knob }}"></span></button>
</div>
<a href="#" style="align-self: stretch; display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; background: #FF7A45; color: #2A0E02; font-size: 16px; font-weight: 700; text-decoration: none">Share to Stories or WhatsApp</a>
<a href="#" style="align-self: stretch; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #1E2124; border: 1px solid #2A2D30; color: #F2F2F2; font-size: 15px; font-weight: 600; text-decoration: none">Save image</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { d: true, fmt: 'story' }; }
  renderVals() {
    var self = this, d = this.state.d;
    return {
      showDedication: d, flip: function () { self.setState({ d: !d }); },
      formats: [['story', '9:16 Story'], ['square', '1:1 Post']].map(function (x) { var on = self.state.fmt === x[0]; return { label: x[1], on: on, pick: function () { self.setState({ fmt: x[0] }); }, style: 'min-height:36px;border-radius:9px;border:none;font-family:inherit;font-size:13px;cursor:pointer;' + (on ? 'background:#FF7A45;color:#2A0E02;font-weight:700;' : 'background:transparent;color:#A0A4A8;font-weight:600;') }; }),
      card: 'width:' + (self.state.fmt === 'story' ? 270 : 320) + 'px;height:' + (self.state.fmt === 'story' ? 480 : 320) + 'px;box-sizing:border-box;border-radius:24px;background:linear-gradient(180deg, rgba(11,13,14,0.15) 0%, rgba(11,13,14,0.75) 100%), url(img/ocean.jpg) center/cover;padding:22px 20px;display:flex;flex-direction:column;gap:' + (self.state.fmt === 'story' ? 14 : 8) + 'px;box-shadow:0 20px 50px rgba(0,0,0,0.5);',
      track: 'width:52px;height:32px;border-radius:999px;border:none;padding:3px;display:flex;align-items:center;cursor:pointer;flex-shrink:0;box-sizing:border-box;' + (d ? 'background:#FF7A45;justify-content:flex-end;' : 'background:#2A2D30;justify-content:flex-start;'),
      knob: 'width:26px;height:26px;border-radius:999px;display:block;' + (d ? 'background:#2A0E02;' : 'background:#A0A4A8;')
    };
  }
}
</script>
</body>
</html>
