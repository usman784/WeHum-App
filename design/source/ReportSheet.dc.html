<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report a post</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050607; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div aria-hidden="true" style="padding: 110px 20px 0 20px; opacity: 0.25; display: flex; flex-direction: column; gap: 12px"><div style="height: 120px; border-radius: 20px; background: #17191B"></div><div style="height: 120px; border-radius: 20px; background: #17191B"></div></div>
<section aria-label="Report this dedication" style="margin-top: auto; background: #17191B; border-top: 1px solid #2A2D30; border-radius: 28px 28px 0 0; padding: 12px 20px 36px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #3A3E42"></div>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Report this dedication</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #A0A4A8">Reports go to Raphael’s team. You won’t see this post again.</p>
<div role="radiogroup" aria-label="Reason" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ reasons }}" as="r" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{ r.on }}" onClick="{{ r.pick }}" style="{{ r.style }}"><span style="{{ r.dot }}"></span>{{ r.label }}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 6px 0">
<span style="flex-grow: 1; font-size: 15px">Block this person</span>
<button type="button" role="switch" aria-label="Hide posts from this person" aria-checked="{{ hide }}" onClick="{{ flipHide }}" style="{{ hideTrack }}"><span style="{{ hideKnob }}"></span></button>
</div>
<a href="Dedications.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; background: #FF7A45; color: #2A0E02; font-size: 16px; font-weight: 700; text-decoration: none">Report</a>
<a href="Dedications.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; color: #A0A4A8; font-size: 15px; font-weight: 600; text-decoration: none">Cancel</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { reason: 0, hide: false }; }
  renderVals() {
    var self = this, s = this.state;
    var reasons = ['Spam or advertising', 'Hurtful or offensive', 'Not about the practice', 'Something else'].map(function (t, i) {
      var on = s.reason === i;
      return {
        label: t, on: on, pick: function () { self.setState({ reason: i }); },
        style: 'display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-radius:14px;font-family:inherit;font-size:15px;text-align:left;cursor:pointer;color:#F2F2F2;' + (on ? 'background:rgba(255,122,69,0.10);border:1.5px solid #FF7A45;' : 'background:#0F1112;border:1px solid #2A2D30;'),
        dot: 'width:18px;height:18px;border-radius:999px;box-sizing:border-box;flex-shrink:0;' + (on ? 'border:5px solid #FF7A45;' : 'border:2px solid #5A5F64;')
      };
    });
    var h = s.hide;
    return {
      reasons: reasons, hide: h, flipHide: function () { self.setState({ hide: !h }); },
      hideTrack: 'width:52px;height:32px;border-radius:999px;border:none;padding:3px;display:flex;align-items:center;cursor:pointer;flex-shrink:0;box-sizing:border-box;' + (h ? 'background:#FF7A45;justify-content:flex-end;' : 'background:#2A2D30;justify-content:flex-start;'),
      hideKnob: 'width:26px;height:26px;border-radius:999px;display:block;' + (h ? 'background:#2A0E02;' : 'background:#A0A4A8;')
    };
  }
}
</script>
</body>
</html>
