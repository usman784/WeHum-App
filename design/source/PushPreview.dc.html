<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Push notifications on lock screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #10161A url('img/night.jpg') center/cover; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 72px">
<span style="font-size: 17px; font-weight: 600; color: #E6E7E8">{{ date }}</span>
<span style="font-size: 82px; font-weight: 600; letter-spacing: -2px; line-height: 1">{{ time }}</span>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 12px 24px 12px">
<sc-for list="{{ items }}" as="n" hint-placeholder-count="2">
<a href="{{ n.href }}" style="display: flex; gap: 12px; padding: 14px; border-radius: 22px; background: rgba(40,44,48,0.72); backdrop-filter: blur(20px); text-decoration: none; color: #F2F2F2">
<span style="width: 38px; height: 38px; border-radius: 10px; background: #0B0D0E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="11" fill="none" stroke="#FF7A45" stroke-width="3.5" stroke-dasharray="52 18" stroke-linecap="round"></circle><circle cx="15" cy="15" r="6" fill="#4ADE80"></circle><circle cx="15" cy="15" r="2.4" fill="#0B0D0E"></circle></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="display: flex; gap: 8px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1">{{ n.title }}</span><span style="font-size: 12px; color: #C9CCCF">{{ n.when }}</span></span><span style="font-size: 14px; line-height: 1.4; color: #E6E7E8">{{ n.body }}</span></span>
</a>
</sc-for>
<span style="align-self: center; font-size: 12px; color: #C9CCCF; background: rgba(11,13,14,0.5); border-radius: 999px; padding: 6px 12px">{{ caption }}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["daily-nudge","global-sit-warning","both"],"default":"both"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var k = this.props.kind ?? 'both';
    var nudge = { title: 'WeHum', when: 'now', body: 'Time to meditate, Marcus. Today’s meditation with Raphael is ready.', href: 'Today.dc.html' };
    var warn = { title: 'Group meditation in 10 minutes', when: '15:50', body: 'Evening Settle starts at 16:00. 312 people are already in the lobby.', href: 'GroupLobby.dc.html' };
    var items = k === 'daily-nudge' ? [nudge] : (k === 'global-sit-warning' ? [warn] : [warn, nudge]);
    return {
      items: items,
      time: k === 'global-sit-warning' ? '15:50' : '07:00',
      date: 'Monday, 5 October',
      caption: k === 'daily-nudge' ? 'Sent at the time you chose, in your time zone' : (k === 'global-sit-warning' ? 'Only if you tapped Remind me, 10 min before' : 'One quiet nudge a day. Never a marketing blast.')
    };
  }
}
</script>
</body>
</html>
