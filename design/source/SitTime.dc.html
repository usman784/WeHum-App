<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup · Sit time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 60px 24px 0 24px">
<div style="display: flex; gap: 6px" aria-label="Step 3 of 4"><span style="flex-grow: 1; height: 4px; border-radius: 999px; background: #FF7A45"></span><span style="flex-grow: 1; height: 4px; border-radius: 999px; background: #FF7A45"></span><span style="flex-grow: 1; height: 4px; border-radius: 999px; background: #FF7A45"></span><span style="flex-grow: 1; height: 4px; border-radius: 999px; background: #2A2D30"></span></div>
<a href="NameStep.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8; text-decoration: none">‹ STEP 2 OF 3</a>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Meditation reminder</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #A0A4A8">We will remind you to meditate daily, as consistency is important.</p>
</div>
<div style="margin: 32px 20px 0 20px; background: #17191B; border: 1px solid #23262A; border-radius: 24px; padding: 24px 20px; display: flex; align-items: center; justify-content: center; gap: 18px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<button type="button" aria-label="Earlier hour" onClick="{{ hUp }}" style="width: 48px; height: 44px; border: none; background: transparent; color: #A0A4A8; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<span style="font-size: 22px; color: #5A5F64">{{ hPrev }}</span>
<span style="font-size: 64px; font-weight: 700; letter-spacing: -1px; line-height: 1">{{ hh }}</span>
<span style="font-size: 22px; color: #5A5F64">{{ hNext }}</span>
<button type="button" aria-label="Later hour" onClick="{{ hDown }}" style="width: 48px; height: 44px; border: none; background: transparent; color: #A0A4A8; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<span style="font-size: 56px; font-weight: 700; color: #FF7A45">:</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<button type="button" aria-label="Earlier minutes" onClick="{{ mUp }}" style="width: 48px; height: 44px; border: none; background: transparent; color: #A0A4A8; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<span style="font-size: 22px; color: #5A5F64">{{ mPrev }}</span>
<span style="font-size: 64px; font-weight: 700; letter-spacing: -1px; line-height: 1">{{ mm }}</span>
<span style="font-size: 22px; color: #5A5F64">{{ mNext }}</span>
<button type="button" aria-label="Later minutes" onClick="{{ mDown }}" style="width: 48px; height: 44px; border: none; background: transparent; color: #A0A4A8; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
</div>
<p style="margin: 0; padding: 16px 24px 0 24px; font-size: 13px; color: #A0A4A8; text-align: center">24-hour clock, in your local time</p>
<div style="margin-top: auto; padding: 0 24px 40px 24px">
<a href="Reminder.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; background: #FF7A45; color: #2A0E02; font-size: 16px; font-weight: 700; text-decoration: none">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { h: 7, m: 0 }; }
  renderVals() {
    var self = this;
    var h = this.state.h, m = this.state.m;
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return {
      hh: pad(h), mm: pad(m),
      hPrev: pad((h + 23) % 24), hNext: pad((h + 1) % 24),
      mPrev: pad((m + 45) % 60), mNext: pad((m + 15) % 60),
      hUp: function () { self.setState({ h: (h + 23) % 24 }); },
      hDown: function () { self.setState({ h: (h + 1) % 24 }); },
      mUp: function () { self.setState({ m: (m + 45) % 60 }); },
      mDown: function () { self.setState({ m: (m + 15) % 60 }); }
    };
  }
}
</script>
</body>
</html>
