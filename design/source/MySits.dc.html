<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Meditations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="Library.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">My Meditations</h1>
<span style="width: 44px; flex-shrink: 0"></span>
</header>
<main style="display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 24px 20px">
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #A0A4A8">Meditations you built and saved. Tap play and it starts, no setup.</p>
<sc-for list="{{ sits }}" as="s" hint-placeholder-count="3">
<div style="background: #17191B; border: 1px solid #23262A; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px">
<span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{ s.name }}</span><span style="font-size: 13px; line-height: 1.4; color: #A0A4A8">{{ s.recipe }}</span></span>
<a href="Player.dc.html" aria-label="Play" style="width: 48px; height: 48px; border-radius: 999px; background: #FF7A45; color: #2A0E02; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg></a>
</div>
</sc-for>
<a href="BuildYourOwn.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; border: 1px dashed #3A3E42; color: #FF9B70; font-size: 15px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Build a new one</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var sits = [
      { name: 'Morning 15', recipe: '15 min · Arrival · Rain (rich) · bells every 5 min' },
      { name: 'Lunch reset', recipe: '10 min · Silence · Distant stream (simple) · start and end' },
      { name: 'Sunday OM meditation', recipe: '22 min · 6 blocks · OM ×3 · mantra ×2 · shared by link' }
    ];
    return { sits: sits };
  }
}
</script>
</body>
</html>
