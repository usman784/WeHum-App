<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discipline · Transcendent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="Library.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="flex-grow: 1"></span>
<a href="Search.dc.html" aria-label="Search" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></a>
<a href="LibraryFilters.dc.html" aria-label="Filters" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a>
</header>
<main style="display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 24px 20px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 60px; height: 60px; border-radius: 16px; background: #17191B; border: 2px solid #FF7A45; color: #FF9B70; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8c-2.2 0-4 1.8-4 4s1.8 4 4 4c3.5 0 6.5-8 10-8 2.2 0 4 1.8 4 4s-1.8 4-4 4c-3.5 0-6.5-8-10-8z"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.4px">Transcendent</h1><span style="font-size: 14px; color: #A0A4A8">Spacious open awareness · 14 meditations</span></div>
</div>
<div role="group" aria-label="Filter" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4"><button type="button" onClick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button></sc-for>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
<a href="{{ r.href }}" style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #23262A; text-decoration: none; color: #F2F2F2">
<span style="{{ r.thumb }}"></span>
<span style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 600; line-height: 1.3">{{ r.title }}</span><span style="font-size: 13px; color: #A0A4A8">{{ r.meta }}</span></span>
<span style="{{ r.tagStyle }}">{{ r.tag }}</span>
</a>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'All' }; }
  renderVals() {
    var self = this;
    var sel = this.state.f;
    var filters = ['All', 'Premium', 'Online library', 'Video'].map(function (t) {
      var on = sel === t;
      return { label: t, pick: function () { self.setState({ f: t }); }, style: 'min-height:40px;padding:0 16px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;' + (on ? 'background:#FF7A45;color:#2A0E02;border:1px solid #FF7A45;' : 'background:#17191B;color:#F2F2F2;border:1px solid #2A2D30;') };
    });
    var tones = ['ocean', 'dawn', 'lake', 'night', 'forest', 'stones'];
    var data = [
      ['Sound as a Gateway', '40 min · Audio', 'SessionDetail.dc.html', 'premium', 'PREMIUM'],
      ['Love Without Fear', '40 min · Video', 'VideoPlayer.dc.html', 'video', 'PREMIUM'],
      ['Guided Meditation for Transcendence', '40 min · Raphael’s online library', 'YouTubePlayer.dc.html', 'free', ''],
      ['Open Awareness &amp; Silence', '18 min · Audio', 'SessionDetail.dc.html', 'premium', 'PREMIUM'],
      ['What If Inner Peace Is Built?', '40 min · Raphael’s online library', 'YouTubePlayer.dc.html', 'free', ''],
      ['The Spacious Mind', '25 min · Audio', 'SessionDetail.dc.html', 'premium', 'PREMIUM']
    ];
    var tag = function (k) {
      var c = k === 'free' ? 'display:none;' : 'background:rgba(255,122,69,0.16);color:#FF9B70;';
      return 'font-size:10px;font-weight:700;letter-spacing:0.8px;border-radius:999px;padding:4px 8px;flex-shrink:0;' + c;
    };
    var rows = data.filter(function (d) {
      if (sel === 'All') return true;
      if (sel === 'Online library') return d[3] === 'free';
      if (sel === 'Video') return d[3] === 'video';
      return d[3] !== 'free';
    }).map(function (d, i) {
      return { title: d[0].replace('&amp;', '&'), meta: d[1], href: d[2], tag: d[4], tagStyle: tag(d[3]), thumb: 'width:64px;height:64px;border-radius:12px;flex-shrink:0;background:#17191B url(img/' + tones[i % 6] + '.jpg) center/cover;' };
    });
    return { filters: filters, rows: rows };
  }
}
</script>
</body>
</html>
