<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathwork</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D0E}
a{color:#FF9B70}a:hover{color:#FFB99A}
</style>
</helmet>
<div style="width: 390px; height: 1080px; box-sizing: border-box; background: #0B0D0E; color: #F2F2F2; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 52px 20px 12px 20px">
<a href="Library.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #17191B; border: 1px solid #23262A; color: #F2F2F2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">Breathwork</h1>
<span style="width: 44px; flex-shrink: 0"></span>
</header>
<main style="display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 28px 20px">
<span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 1px; border-radius: 999px; padding: 4px 10px; background: #23262A; color: #C9CCCF">COMING SOON</span>

<a href="BreathPattern.dc.html" style="position: relative; height: 170px; border-radius: 24px; overflow: hidden; background: #123C3A url('img/stones.jpg') center/cover; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; box-sizing: border-box; text-decoration: none; color: #F2F2F2">
<span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,13,14,0) 20%, rgba(11,13,14,0.85) 100%)"></span>
<span style="position: relative; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #9FE3D6">DESIGN YOUR OWN</span>
<span style="position: relative; font-size: 20px; font-weight: 700">Pattern designer</span>
<span style="position: relative; font-size: 13px; color: #CFEDE6">Rounds and beats for in, hold, out, hold</span>
</a>

<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8; padding-top: 4px">START FROM A TEMPLATE</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ templates }}" as="t" hint-placeholder-count="5">
<a href="BreathPattern.dc.html" style="background: #17191B; border: 1px solid #23262A; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #F2F2F2">
<span style="{{ t.chip }}">{{ t.beats }}</span>
<span style="font-size: 15px; font-weight: 600">{{ t.name }}</span>
<span style="font-size: 12px; color: #A0A4A8">{{ t.sub }}</span>
</a>
</sc-for>
</div>

<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #A0A4A8; padding-top: 4px">LESSONS WITH RAPHAEL</span>
<sc-for list="{{ lessons }}" as="l" hint-placeholder-count="3">
<a href="SessionDetail.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid #23262A; text-decoration: none; color: #F2F2F2">
<span style="{{ l.art }}"></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">{{ l.name }}</span><span style="font-size: 12px; color: #A0A4A8">{{ l.meta }}</span></span>
</a>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var chip = function (c) { return 'align-self:flex-start;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;background:rgba(159,227,214,0.12);color:' + c + ';'; };
    var templates = [['Calming', '4 · 7 · 8', 'Longer out-breath', '#9FE3D6'], ['Focus', '4 · 4 · 4 · 4', 'Box breathing', '#FFB99A'], ['Energy', '2 · 0 · 2', 'Quick, bright rounds', '#FF9B70'], ['Vagus nerve', '4 · 0 · 6', 'Slow hum on the out', '#4ADE80'], ['Anxiety', '5 · 0 · 5', 'Even, steady pace', '#CDB6E6'], ['Sleep', '4 · 2 · 8', 'Heavy and slow', '#A9C4E8']].map(function (t) { return { name: t[0], beats: t[1], sub: t[2], chip: chip(t[3]) }; });
    var art = function (i) { return 'width:56px;height:56px;border-radius:12px;flex-shrink:0;background:#17191B url(img/' + i + '.jpg) center/cover;'; };
    var lessons = [['Why the out-breath calms you', 'Lesson 1 · 6 min', 'ocean'], ['Breathing through the nose', 'Lesson 2 · 5 min', 'forest'], ['Holding without strain', 'Lesson 3 · 7 min', 'lake']].map(function (l) { return { name: l[0], meta: l[1], art: art(l[2]) }; });
    return { templates: templates, lessons: lessons };
  }
}
</script>
</body>
</html>
