name: wehum
description: WeHum — you never meditate alone.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# Pin exact versions at P0 and record them in the phase report (§16).
dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }
  get: ^4.6.6
  dio: ^5.7.0
  socket_io_client: ^3.0.0
  flutter_secure_storage: ^9.2.2
  get_storage: ^2.1.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.0
  purchases_flutter: ^8.0.0
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  video_player: ^2.9.1
  chewie: ^1.8.5
  youtube_player_iframe: ^5.2.0
  firebase_core: ^3.6.0          # required by firebase_messaging only
  firebase_messaging: ^15.1.3    # push transport only — no other Firebase product
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  sentry_flutter: ^8.9.0
  sentry_dio: ^8.9.0
  sign_in_with_apple: ^6.1.2
  google_sign_in: ^6.2.1
  background_downloader: ^8.5.5
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.4.1
  flutter_blurhash: ^0.8.2
  flutter_svg: ^2.0.10
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  screen_brightness: ^1.0.1
  wakelock_plus: ^1.2.8
  add_2_calendar: ^3.0.1
  intl: any

dev_dependencies:
  flutter_test: { sdk: flutter }
  integration_test: { sdk: flutter }
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.0
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/images/
    - assets/audio/        # silence padding, bells fallback
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0B0D0E"
  image: assets/brand/logo_512.png
