include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - starter/**   # reference copy from the design hand-off; the real code is in lib/
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: true
    always_declare_return_types: true
